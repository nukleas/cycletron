name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#
# Builds macOS (universal, signed + notarized — .app AND .dmg), Linux
# (AppImage/deb/rpm, the Tauri default target set), and Windows (NSIS only —
# MSI/WiX rejects pre-release versions; intentionally UNSIGNED — SmartScreen
# "More info → Run anyway"; see docs/RELEASE.md). Signs the Tauri updater
# artifacts and publishes latest.json so auto-update works.
#
# Everything lands in a single DRAFT pre-release — nothing is public until you
# review it and hit Publish.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The strudel-rs engine is a Codeberg git dependency; libgit2's SSL stack
  # flakes fetching it on CI runners ("SSL error: unknown error; class=Ssl").
  # Shell out to the system git, which fetches reliably.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  release:
    name: Build & release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # Holds APPLE_CERTIFICATE_BASE64; its deployment policy permits only v* tags,
    # so the Developer ID key is unreachable from PRs, forks, or branch pushes.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            # NSIS only: the MSI/WiX target rejects pre-release versions
            # (0.1.0-alpha.N) — "pre-release identifier must be numeric-only".
            args: '--bundles nsis'
            rust-targets: ''
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set app version from tag
        shell: bash
        env:
          V: ${{ github.ref_name }}
        run: |
          export VERSION="${V#v}"
          echo "Releasing version $VERSION"
          # The updater compares against tauri.conf.json's version, so it must
          # match the tag or installed apps won't see the update. Also blank out
          # beforeBuildCommand: the frontend is built by the explicit step below
          # (the config's `cd ../ui && …` resolves its cwd differently on the
          # Windows runner and fails). node keeps this identical across OSes.
          node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;c.build=c.build||{};c.build.beforeBuildCommand='';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          node -e "console.log('version =', require('./src-tauri/tauri.conf.json').version)"

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        working-directory: ui
        run: npm ci && npm run build

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # webkit/rsvg/appindicator for Tauri; libasound2-dev + libudev-dev for
          # the MIDI input crate (midir → alsa-sys) which otherwise fails at
          # "Package alsa was not found in the pkg-config search path".
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev xdg-utils

      # tauri-bundler downloads NSIS at bundle time with an HTTP client that
      # intermittently dies on GitHub's release-assets CDN ("io: Peer
      # disconnected") — after the full 14-minute Rust build. Seed its cache
      # up front with a retrying downloader instead; with all required files
      # present and hash-matched the bundler skips its own downloads entirely.
      # The pinned NSIS/plugin versions + SHA1 track tauri-bundler's constants
      # (crates/tauri-bundler/src/bundle/windows/nsis/mod.rs); if a CLI bump
      # changes them the bundler just falls back to downloading as before.
      - name: Pre-seed NSIS for tauri-bundler (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 `
            -Uri 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' `
            -OutFile "$tools\nsis-3.11.zip"
          Expand-Archive -Path "$tools\nsis-3.11.zip" -DestinationPath $tools -Force
          Rename-Item -Path "$tools\nsis-3.11" -NewName 'NSIS'
          $additional = "$tools\NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $additional | Out-Null
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 `
            -Uri 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' `
            -OutFile "$additional\nsis_tauri_utils.dll"
          $sha1 = (Get-FileHash -Algorithm SHA1 "$additional\nsis_tauri_utils.dll").Hash
          if ($sha1 -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') {
            throw "nsis_tauri_utils.dll SHA1 mismatch: $sha1"
          }
          foreach ($f in 'makensis.exe', 'Stubs\lzma-x86-unicode', 'Stubs\lzma_solid-x86-unicode') {
            if (-not (Test-Path "$tools\NSIS\$f")) { throw "NSIS cache is missing $f" }
          }

      # ── macOS only: import the Developer ID cert into a temp keychain and
      #    auto-detect the identity. ──────────────────────────────────────────
      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 is not set — cannot sign/notarize the macOS release for $GITHUB_REF_NAME. See docs/RELEASE.md."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$APPLE_CERTIFICATE_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Import the whole .p12 (cert + private key); do NOT use -t cert.
          if ! security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
                 -A -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::Could not import the .p12 — wrong APPLE_CERTIFICATE_PASSWORD, or not a valid PKCS#12 export."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          if [ -z "$SIGN_ID" ]; then
            echo "::error::No 'Developer ID Application' identity in the .p12 — the export likely omitted the private key."
            exit 1
          fi
          echo "Signing with: $SIGN_ID"
          echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Build, sign, and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          # The default GITHUB_TOKEN is refused for release creation on this repo
          # ("Resource not accessible by integration") even with contents:write,
          # so use a PAT (RELEASE_TOKEN) which can create releases here.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Updater signature (all platforms).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple (macOS only; empty + ignored elsewhere). Identity auto-detected above.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          # Must NOT default to context.sha: the fine-grained RELEASE_TOKEN 403s
          # on create-release when target_commitish is a bare SHA ("Resource not
          # accessible by personal access token"). A branch name works, and the
          # value is ignored anyway because the v* tag always exists.
          releaseCommitish: master
          releaseName: 'Cycletron ${{ github.ref_name }}'
          releaseBody: 'Automated build. Draft pre-release — review before publishing.'
          releaseDraft: true
          # Not marked prerelease: GitHub's releases/latest (the updater
          # endpoint) skips prereleases, so auto-update would 404 or go stale.
          # The alpha status is carried by the version string itself.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri notarizes the .app (used by the updater), but NOT the .dmg users
      # download — so notarize + staple the DMG and replace it on the release.
      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Workspace target dir is at the repo root (not src-tauri/target); find
          # the DMG wherever the bundler put it.
          DMG=$(find . -path '*universal-apple-darwin/release/bundle/dmg/*.dmg' 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced to notarize."
            exit 1
          fi
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vvv "$DMG"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

  # The ubuntu-22.04 runner's linuxdeploy bundles libwayland-client.so.0 into
  # the AppImage; at runtime it shadows the host copy and breaks Mesa EGL on
  # rolling distros — EGL_BAD_ALLOC even for the surfaceless platform (#6).
  # The bundled wayland libs are dead weight anyway: the AppRun hook forces
  # GDK_BACKEND=x11, so only host Mesa ever dlopens libwayland-client — and it
  # needs its own. Strip them, repack, re-sign, and fix the updater signatures.
  # Runs after the whole build matrix so every job's latest.json merge is done
  # (patching from inside the linux job would race the other uploads).
  fix-appimage:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Strip bundled wayland libs, re-sign, patch latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.AppImage' --pattern latest.json
          APPIMAGE=$(ls ./*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          rm -v squashfs-root/usr/lib/libwayland-*.so*
          # bundleMediaFramework ships a GStreamer stack for the bundled
          # WebKit's audio output — list what landed so licensing stays
          # reviewable (the "ugly" plugin set must never appear here).
          echo "--- bundled gstreamer plugins ---"
          ls squashfs-root/usr/lib/gstreamer-1.0/ 2>/dev/null || echo "(none)"
          echo "--- bundled usr/lib after strip ---"
          ls squashfs-root/usr/lib/
          wget -qO appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          npx -y @tauri-apps/cli@2 signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE"
          SIG=$(cat "$APPIMAGE.sig")
          python3 - "$SIG" <<'EOF'
          import json, sys
          sig = sys.argv[1]
          j = json.load(open('latest.json'))
          for entry in j['platforms'].values():
              if entry.get('url', '').endswith('.AppImage'):
                  entry['signature'] = sig
          json.dump(j, open('latest.json', 'w'), indent=2)
          EOF
          gh release upload "$GITHUB_REF_NAME" "$APPIMAGE" "$APPIMAGE.sig" latest.json \
            --clobber --repo "$GITHUB_REPOSITORY"
