name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#
# The build is signed (Tauri updater signature + Apple Developer ID /
# notarization) and published as a DRAFT pre-release — nothing is public until
# you review the draft in GitHub and hit Publish. `latest.json` (the updater
# manifest) is generated and attached automatically.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  release-macos:
    name: Build & sign (macOS universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust stable (+ universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build, sign, notarize, and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature — required so installed apps accept the update.
          # Generated locally with `cargo tauri signer generate`; pubkey lives in
          # tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization (Gatekeeper). If these
          # secrets are absent the build still runs but ships unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cycletron ${{ github.ref_name }}'
          releaseBody: 'Automated build. Draft pre-release — review before publishing.'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          args: --target universal-apple-darwin
