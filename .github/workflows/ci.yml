name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        # The real WASM types are committed under ui/pkg (built from the pinned
        # strudel-rs main rev), so tsc checks against the actual engine surface.
        run: npx tsc --noEmit

  rust:
    name: Rust test + corpus-check
    runs-on: ubuntu-latest
    steps:
      # strudel-rs is a pinned git dependency (Codeberg, public), fetched by
      # cargo — no sibling checkout needed.
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      - name: cargo test (lib crates, no Tauri GUI)
        run: |
          cargo test -p cycletron-core --locked
          cargo test -p cycletron-agent --locked
          cargo test -p cycletron-corpus --locked
          cargo test -p cycletron-analysis --locked
          cargo test -p cycletron-gen --locked

      - name: corpus-check (curated patterns)
        run: cargo run -p corpus-check --locked

  gate-a-files:
    name: Gate A file checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required release files
        run: |
          test -f LICENSE
          test -f README.md
          test -f docs/USER_GUIDE.md
          test -f docs/DIALECT.md
          test -f docs/PUBLISH_READINESS.md
          test -f docs/RELEASE.md
          test -f Cargo.lock
          test -f src-tauri/tauri.conf.json
          # CSP must not be null
          ! grep -q '"csp": null' src-tauri/tauri.conf.json
          # Production window: DevTools off
          grep -q '"devtools": false' src-tauri/tauri.conf.json
          echo "Gate A file checklist OK"
