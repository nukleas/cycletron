name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Stub WASM package types (no nightly build in CI)
        run: |
          mkdir -p pkg
          cat > pkg/strudel_audio_wasm.d.ts << 'EOF'
          export declare class MainThreadProcessor {
            free(): void;
            constructor(...args: any[]);
            static allocAudioSample(...args: any[]): any;
            [key: string]: any;
          }
          export declare class PatternHandle {
            free(): void;
            queryCycleViewData(...args: any[]): any;
            getTrackName(...args: any[]): any;
            queryVizRectsView(...args: any[]): any;
            [key: string]: any;
          }
          export declare class WorkletProcessor {
            free(): void;
            constructor(...args: any[]);
            getLeftPtr(): number;
            getRightPtr(): number;
            getArgsPtr(): number;
            renderBlock(...args: any[]): any;
            [key: string]: any;
          }
          export declare function initSync(...args: any[]): any;
          export declare function take_last_panic(): string | undefined;
          export declare function getCycleViewBufPtr(...args: any[]): any;
          export declare function getPianoRectsBufPtr(...args: any[]): any;
          export declare function getActiveLocsBufPtr(...args: any[]): any;
          export declare function getCurrentBpmPtr(...args: any[]): any;
          export declare function getMissingGMBitsPtr(...args: any[]): any;
          export declare function getMissingGMSampleBitsPtr(...args: any[]): any;
          export declare function getAudioAllocLogPtr(...args: any[]): any;
          export declare function getBankNameBufPtr(...args: any[]): any;
          export declare function getMainAllocLogPtr(...args: any[]): any;
          export declare function getVoiceCountPtr(...args: any[]): any;
          export declare function parsePattern(...args: any[]): any;
          export declare function version(...args: any[]): any;
          export default function init(input?: any): Promise<any>;
          EOF
          printf "export * from './strudel_audio_wasm';\nexport { default } from './strudel_audio_wasm';\n" > pkg/index.d.ts
      - name: Typecheck
        run: npx tsc --noEmit

  rust:
    name: Rust test + corpus-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cycletron
        uses: actions/checkout@v4
        with:
          path: cycletron

      - name: Checkout strudel-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STRUDEL_RS_REPO || 'nukleas/strudel-rs' }}
          path: strudel-rs
          # Private sibling: set repo secret STRUDEL_RS_TOKEN (read-only PAT) if needed.
          token: ${{ secrets.STRUDEL_RS_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cycletron -> target

      - name: cargo check (workspace)
        working-directory: cycletron
        run: cargo check --workspace --locked

      - name: cargo test (lib crates, no Tauri GUI)
        working-directory: cycletron
        run: |
          cargo test -p cycletron-core --locked
          cargo test -p cycletron-agent --locked
          cargo test -p cycletron-corpus --locked
          cargo test -p cycletron-analysis --locked
          cargo test -p cycletron-gen --locked

      - name: corpus-check (curated patterns)
        working-directory: cycletron
        run: cargo run -p corpus-check --locked

  gate-a-files:
    name: Gate A file checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required release files
        run: |
          test -f LICENSE
          test -f README.md
          test -f docs/USER_GUIDE.md
          test -f docs/DIALECT.md
          test -f docs/PUBLISH_READINESS.md
          test -f docs/RELEASE.md
          test -f Cargo.lock
          test -f src-tauri/tauri.conf.json
          # CSP must not be null
          ! grep -q '"csp": null' src-tauri/tauri.conf.json
          # Production window: DevTools off
          grep -q '"devtools": false' src-tauri/tauri.conf.json
          echo "Gate A file checklist OK"
