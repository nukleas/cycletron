name: Runner smoke test

# Temporary: proves the self-hosted cycletron-runners scale set picks up jobs.
# Remove once the real workflows are migrated.
on:
  push:
    branches: [feat/sample-packs]
    paths: ['.github/workflows/runner-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: cycletron-runners
    steps:
      - run: |
          echo "hello from a self-hosted runner"
          uname -a
          echo "cores: $(nproc)"
          free -h || true
