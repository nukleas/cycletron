version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # zip must stay on the major tauri-plugin-updater pulls in, so the two
      # unify into one copy (src-tauri/Cargo.toml). Bump with the updater.
      - dependency-name: zip
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
