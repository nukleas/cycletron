[workspace]
members = [
    "crates/cycletron-core",
    "crates/cycletron-agent",
    "crates/cycletron-corpus",
    "crates/cycletron-doc",
    "crates/cycletron-gen",
    "crates/cycletron-midi",
    "crates/cycletron-analysis",
    "src-tauri",
    "tools/parity/dsl-eval",
    "tools/parity/corpus-scan",
    "tools/corpus-check",
    "tools/hap-ingest",
    "tools/midi-inspect",
    "tools/midi-ingest",
    "tools/strudel-search",
    "tools/agent-stats",
    "tools/gen-pattern",
    "tools/gen-recipes",
    "tools/song-check",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nukleas/cycletron"

# Moderate lint policy (mirrors the spirit of strudel-rs's, minus its
# DSP-specific type/method bans): perf + a few idiom lints at warn, gated to
# deny in CI via `cargo clippy -- -D warnings`.
[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
redundant_closure_for_method_calls = "warn"

# Thin LTO: most of fat LTO's win without multiplying the full-Tauri link
# time. Shipping builds can bump to lto = true / codegen-units = 1 later
# without code changes.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace.dependencies]
# Internal crates
cycletron-core = { path = "crates/cycletron-core" }
cycletron-agent = { path = "crates/cycletron-agent" }
cycletron-corpus = { path = "crates/cycletron-corpus" }
cycletron-doc = { path = "crates/cycletron-doc" }
cycletron-gen = { path = "crates/cycletron-gen" }
cycletron-midi = { path = "crates/cycletron-midi" }
cycletron-analysis = { path = "crates/cycletron-analysis" }
# strudel-rs engine crates — pinned to public Codeberg main so the app builds
# from a clean clone (no sibling checkout needed). Bump `rev` to move the engine.
strudel-core = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }
strudel-mini = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2", default-features = false }
strudel-dsl = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }
strudel-audio = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }
strudel-sounds = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }
strudel-music-theory = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }
midi-to-strudel = { git = "https://codeberg.org/nukleas/strudel-rs.git", rev = "07b45508dbe237ac5a510e7469d48c5ef5e4e0e2" }

# Shared external deps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
midly = "0.5"
hound = "3.5"
rustc-hash = "2"
criterion = { version = "0.8.2", features = ["html_reports"] }