[package]
name = "cycletron-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cycletron-core = { workspace = true }
cycletron-agent = { workspace = true }
cycletron-corpus = { workspace = true }
cycletron-gen = { workspace = true }
cycletron-analysis = { workspace = true }
cycletron-doc = { workspace = true }
cycletron-midi = { workspace = true }
midi-to-strudel = { workspace = true }
strudel-dsl = { workspace = true }
strudel-mini = { workspace = true }
strudel-audio = { workspace = true }
strudel-sounds = { workspace = true }
strudel-core = { workspace = true }
strudel-music-theory = { workspace = true }
midly = { workspace = true }
hound = { workspace = true }
rustc-hash = { workspace = true }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-opener = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-window-state = "2.4"
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-notification = "2.3"
tauri-plugin-store = "2.4"
# 0.11 unifies with cpal's alsa 0.11 (0.10 forced alsa 0.9 and broke resolve)
midir = "0.11"
# OS keychain for API-key storage (release builds only; debug uses a local file).
# Platform backends: macOS keychain, Linux Secret Service, Windows Credential Manager.
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = "0.11"
open = "5"
# OSC encoding for the UDP output stream (see src/osc.rs).
rosc = "0.11"
# Ableton Link tempo/phase sync (see src/link.rs). GPLv2+, which AGPLv3 §13
# permits combining with, so no commercial Ableton licence is needed. Unlike
# the deps above this one builds Ableton's C++ Link via cmake + bindgen, so
# the macOS-universal / AppImage / NSIS jobs need cmake and libclang present.
rusty_link = "0.4"
# Free-space query for the recording sink. Pure Rust — no new -sys crate, so
# the macOS-universal / AppImage / NSIS jobs are unaffected.
fs4 = "0.13"

# For proper production SAB support:
# We embed the frontend and serve it over real http://127.0.0.1 so WebKit
# properly exposes SharedArrayBuffer + Atomics (tauri:// scheme does not).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# The _lib suffix keeps the lib's artifacts (.pdb/.lib) from colliding with the
# cycletron-app bin target on Windows MSVC, which flattens both to cycletron_app.*
name = "cycletron_app_lib"
crate-type = ["lib", "staticlib", "cdylib"]
